# Local infra: MySQL, MongoDB, Redis. When running the app via Compose, point
# the app's env vars at these service hostnames, e.g.:
#   DATABASE_URL=mysql://root:applico_dev@mysql:3306/applico
#   MONGODB_URI=mongodb://mongo:27017/applico
#   REDIS_URL=redis://redis:6379
# (Local `npm run dev` outside Compose keeps using 127.0.0.1 values in .env.)
services:
  mysql:
    image: mysql:8.4
    container_name: applico-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-applico_dev}
      MYSQL_DATABASE: ${DB_NAME:-applico}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-applico_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: applico-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: applico-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nextjs:
    build:
      context: .
      dockerfile: docker/Dockerfile.nextjs
    container_name: nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
#    healthcheck:
#      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health || exit 1"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      nextjs:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  socket:
    build:
      context: .
      dockerfile: docker/Dockerfile.socket
    container_name: socket
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 3001
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
  redis-data: