services:
  nextjs:
    build:
      context: .
      dockerfile: docker/Dockerfile.nextjs
    container_name: nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    env_file:
      - .env
    networks:
      - app-network
#    healthcheck:
#      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health || exit 1"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      - nextjs

  socket:
    build:
      context: .
      dockerfile: docker/Dockerfile.socket
    container_name: socket
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 3001
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  app-network:
    driver: bridge